[package]
name = "nvnmchain-anchoring"
version = "0.1.0"
edition = "2021"
description = "Indexer over the nvnmchain anchoring precompile's Anchored log"
license = "MIT"

[dependencies]
anyhow = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha3 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
